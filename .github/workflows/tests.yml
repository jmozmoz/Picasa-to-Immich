name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Python and the latest release, on Linux and Windows.
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.x" }
          - { os: windows-latest, python-version: "3.x" }
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # setuptools-scm needs the tags to compute the version

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package with test and lint tools
        run: python -m pip install -e ".[test,lint]"

      - name: Show the version
        run: picasa-to-immich --version

      # Includes the code-style checks (black, pylint, mypy, pyright) in tests/test_code_style.py.
      - name: Run the tests
        run: python -m pytest
